[project]
name = "lumin-scholar"
version = "0.1.0"
description = "LuminBuddy Scholar Worker — private-network bounded research operations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "LuminBuddy" }]
# httpx (T04): the only third-party dependency, pinned exactly.
# Rationale: discovery providers, the constrained downloader and the rank LLM
# call all need reliable per-request connect/read timeouts, streaming downloads
# with byte caps, and an injectable transport (httpx.MockTransport) so every
# unit test runs fully offline. urllib offers none of these cleanly.
dependencies = [
    "httpx==0.28.1",
    "pypdf==6.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
