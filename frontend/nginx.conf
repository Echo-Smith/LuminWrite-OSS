# Map: determine if request originates from WeKnora UI iframe
# by checking the Referer header for /weknora-ui path
map $http_referer $weknora_iframe {
    default                    0;
    ~*"/weknora-ui"            1;
    "~*/weknora-ui/"           1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ───────────────────────────────
    # Allow framing from same origin (for WeKnora UI iframe in admin panel)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Health check endpoint — respond 200 directly without proxying
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── WeKnora API proxy ──────────────────────────────
    # WeKnora UI JS calls /api/v1/... — route these to the WeKnora app, not our backend.
    # Our app uses /api/v2/ so there is no conflict.
    location /api/v1/ {
        proxy_pass http://weknora-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # API proxy → backend (v2 and other routes)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeout for streaming LLM responses
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Buffering off for SSE/streaming
        proxy_buffering off;
    }

    # ── WeKnora UI proxy (iframe embedding — same origin) ──────────
    # Proxy WeKnora UI HTML and rewrite asset paths from /assets/ to /weknora-ui/assets/
    # ^~ gives priority over regex locations (e.g. *.js cache rule)
    location ^~ /weknora-ui/ {
        proxy_pass http://weknora-ui:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (WeKnora UI may use WS for real-time updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Rewrite absolute paths in HTML to /weknora-ui/ prefixed paths
        sub_filter 'href="/assets/' 'href="/weknora-ui/assets/';
        sub_filter 'src="/assets/'  'src="/weknora-ui/assets/';
        sub_filter 'href="/config.js"' 'href="/weknora-ui/config.js"';
        sub_filter 'src="/config.js"'  'src="/weknora-ui/config.js"';
        sub_filter 'src="/tdesign-icons/' 'src="/weknora-ui/tdesign-icons/';
        sub_filter 'href="/tdesign-icons/' 'href="/weknora-ui/tdesign-icons/';
        sub_filter_once off;
        sub_filter_types text/html application/javascript;
    }

    # ── WeKnora UI SPA routes (when loaded inside iframe) ──────────
    # WeKnora UI uses history-mode routing with absolute paths (/login, /platform, etc.)
    # When the iframe navigates to these paths, the Referer header contains /weknora-ui
    # so we proxy to WeKnora UI. Otherwise, serve our own SPA.
    location ~ ^/(login|register|join|platform|knowledgeBase|onboarding|files)(/|$) {
        if ($weknora_iframe) {
            proxy_pass http://weknora-ui:80;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — never cache index.html so new deploys take effect immediately
    location / {
        if ($weknora_iframe) {
            proxy_pass http://weknora-ui:80;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets (hashed filenames, safe to cache long-term)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        if ($weknora_iframe) {
            proxy_pass http://weknora-ui:80;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
