server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 阻止 Nginx 在重定向中拼接内部端口 ────────────────
    # 当外部反向代理（1Panel / HTTPS 终结器）将请求转发到容器 8080 时，
    # Nginx 默认会用 Host + 端口生成绝对重定向 URL，
    # 导致浏览器看到 https://domain:8080/... → ERR_CONNECTION_CLOSED。
    # 三条指令全部关闭，确保 try_files / index 重定向使用相对路径。
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # ── Security Headers ───────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Health check endpoint (for Docker / 1Panel)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API proxy → backend (handles /api/v2/... for REST + WebSocket)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeout for streaming LLM responses
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Buffering off for SSE/streaming
        proxy_buffering off;
    }

    # ── Root-path deployment (dedicated subdomain) ──────
    # Vite builds with base: '/', so all asset references are relative.
    # React Router uses no basename, routes are /write, /topics, etc.
    # try_files ensures /write, /admin, etc. all fall back to index.html for SPA routing.
    # 精确匹配静态 HTML 页面（maintenance.html, 404.html），不走 SPA fallback
    location ~ ^/(maintenance|404)\.html$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets (hashed filenames, safe to cache long-term)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 自定义错误页面 ────────────────────────────────────
    # 404: 静态 404 页面，引导用户返回正确页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/html;
    }

    # 502/503/504: 后端不可用时显示维护中页面
    # 返回 200 状态码，防止外层代理再次拦截
    error_page 502 503 504 =200 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
    }
