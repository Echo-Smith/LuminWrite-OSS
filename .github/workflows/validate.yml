name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match docker-compose and migration 045, which creates pg_search.
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writing_agent_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/writing_agent_v2?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test backend
        working-directory: backend
        # Several integration packages run migrations against this one service;
        # package-level parallelism would race the shared schema.
        run: go test -p 1 ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        # tw-shimmer currently declares a Tailwind 4-only peer range while this
        # product remains on Tailwind 3; the existing lockfile is the tested set.
        run: npm ci --legacy-peer-deps
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated and operating-system metadata
        run: |
          if find . -path './.git' -prune -o -name '.DS_Store' -print -o -name '._*' -print -o -name '__pycache__' -print | grep -q .; then
            echo "Forbidden generated or operating-system metadata found"
            exit 1
          fi
