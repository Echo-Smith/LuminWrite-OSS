name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Migration 045 creates ParadeDB's pg_search extension, so CI must use
        # the same PostgreSQL image as docker-compose and 1Panel deployments.
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writing_agent_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/writing_agent_v2?sslmode=disable
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify backend
        run: make verify-backend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Verify frontend
        run: make verify-frontend
