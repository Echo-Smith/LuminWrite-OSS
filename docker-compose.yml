# ─── LuminBuddy V2 — Docker Compose ──────────────────
# Quick start:
#   cp .env.docker.example .env.docker  # fill in API keys
#   docker compose up -d                # starts all services
#
# Services: postgres (paradedb+pgvector) · docreader · backend (Go) · frontend (Nginx)

services:
  # ── PostgreSQL + pgvector + paradedb (BM25) ──────────
  # Replaces both the old pgvector image and the separate weknora-postgres.
  # paradedb includes: pgvector, pg_bm25 (BM25 full-text search), and more.
  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    container_name: luminbuddy-v2-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: writing_agent_v2
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d writing_agent_v2"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # ── Docreader (document parsing sidecar, TCP port 50051) ──
  # Lightweight document parsing. Called by backend via TCP protocol.
  # Replaces the 5.53GB wechatopenai/weknora-docreader with a ~150MB slim image.
  # Supports: PDF, Word (.docx/.doc), Excel (.xlsx/.xls), PowerPoint (.pptx/.ppt),
  #           HTML, Markdown, CSV, JSON, plain text.
  docreader:
    build:
      context: ./docker/docreader
      dockerfile: Dockerfile
    image: luminbuddy-v2-docreader:latest
    container_name: luminbuddy-v2-docreader
    volumes:
      - docreader_tmp:/tmp/docreader
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ── Backend (Go) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: luminbuddy-v2-backend:latest
    container_name: luminbuddy-v2-backend
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/writing_agent_v2?sslmode=disable
      # Docreader TCP address (slim sidecar for document parsing)
      DOCREADER_ADDR: docreader:50051
      DOCREADER_TRANSPORT: tcp
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - internal
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      docreader:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    init: true
    restart: unless-stopped

  # ── Frontend (React + Nginx) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: luminbuddy-v2-frontend:latest
    container_name: luminbuddy-v2-frontend
    ports:
      - "${FRONTEND_PORT:-3002}:8080"
    networks:
      - frontend
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    init: true
    restart: unless-stopped

# ── Networks ────────────────────────────────────────────
networks:
  # Internal network: all backend services (DB, docreader, backend)
  internal:
    driver: bridge
  # Frontend network: frontend + backend (Nginx proxies to backend)
  frontend:
    driver: bridge

# ── Volumes ─────────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  docreader_tmp:
    driver: local
