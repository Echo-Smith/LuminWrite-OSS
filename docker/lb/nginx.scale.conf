# ─── LuminBuddy V2 — Nginx Load Balancer Config (Multi-Instance) ───
# 
# This Nginx configuration is used when running multiple backend instances
# behind a load balancer. It provides:
#
# 1. Sticky sessions (ip_hash) — WebSocket connections from the same client
#    always route to the same backend instance
# 2. Health check-based upstream — unhealthy backends are automatically removed
# 3. WebSocket upgrade support — proper headers for ws:// and wss://
# 4. Long timeout for streaming — 300s for agent responses

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    # ── Upstream: backend instances ────────────────────
    # ip_hash ensures sticky sessions — same client IP → same backend
    # This is critical for WebSocket session resume (paused sessions live
    # in-memory on a specific instance)
    upstream backend_api {
        ip_hash;
        
        # These entries are populated by Docker's DNS resolver.
        # In Docker Swarm mode, use `backend:8080` as a single entry
        # and Docker's internal DNS will round-robin.
        server backend:8080;
        
        # For manual multi-instance without Swarm, add individual instances:
        # server backend-1:8080;
        # server backend-2:8080;
    }

    # ── Logging ─────────────────────────────────────────
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Timeouts for long-running agent responses ──────
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_buffering       off;  # Disable buffering for streaming

    # ── WebSocket Upgrade Map ───────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Main Server ──────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # ── Health check endpoint (direct, no proxy) ──
        location /health {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── 维护页面（后端不可用时直接返回） ──
        # 当 backend 容器关闭时，502 错误会被拦截并返回维护页面
        # 维护页面由 frontend 容器提供
        location = /maintenance.html {
            proxy_pass http://frontend:8080/maintenance.html;
            proxy_set_header Host $host;
            proxy_intercept_errors off;
        }

        # ── 拦截后端错误，返回维护页面 ──
        # 502 = backend 容器未启动 / 正在重启
        # 503 = backend 拒绝连接
        # 504 = backend 超时
        # 返回 200 状态码，防止外层 OpenResty/1Panel 再次拦截 502
        proxy_intercept_errors on;
        error_page 502 503 504 =200 /maintenance.html;

        # ── WebSocket endpoint (sticky session critical) ──
        # WebSocket connections must be sticky — once a client connects
        # to a backend instance, all subsequent messages for that session
        # must go to the same instance (in-memory session state).
        location /api/v2/ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket-specific timeouts
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # ── SSE endpoint (sticky for topic notifications) ──
        location /api/v2/sse/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;  # 24h for long-lived SSE
        }

        # ── All other API routes ──
        location /api/v2/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Frontend (static files served by frontend container) ──
        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
